name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps
      - run: pnpm --filter @cliniko-companion/patient-portal build
      - run: pnpm --filter @cliniko-companion/practitioner-extension build
      - run: pnpm --filter @cliniko-companion/patient-portal test:e2e
      - run: pnpm --filter @cliniko-companion/practitioner-extension test:e2e
